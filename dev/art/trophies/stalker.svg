<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Stalker's Talon">
<!-- Stalker's Talon (AGI / Swift Stalker). Raptor talon taken at the joint: warm
     keratin at the severed base running to near-black horn at the tip, a chipped
     point with a crack running back from it, a stub of tendon at the cut.
     The long specular following the convex edge is the whole trick with keratin -
     one continuous curved highlight, interior to the silhouette, never on it.
     Cool AGI blue appears only as reflected fill light on the concave edge. -->
<defs>
  <!-- outer contour. Upper-left edge dark (key rolls off), lower-right lifts to a
       cool fill so the shape never dissolves into near-black. -->
  <linearGradient id="st-cont" x1="0.1" y1="0.04" x2="0.88" y2="0.96">
    <stop offset="0" stop-color="#1a130c"/>
    <stop offset=".4" stop-color="#241a11"/>
    <stop offset=".74" stop-color="#3c4a55"/>
    <stop offset="1" stop-color="#55707f"/>
  </linearGradient>
  <!-- keratin body: light amber-bone at the base falling to dark horn at the tip.
       The light end stops at L~72 and lives inside the contour. -->
  <linearGradient id="st-horn" x1="0.26" y1="0.04" x2="0.62" y2="0.96">
    <stop offset="0" stop-color="#eadcc0"/>
    <stop offset=".1" stop-color="#d4bd95"/>
    <stop offset=".28" stop-color="#ab8d62"/>
    <stop offset=".5" stop-color="#7a5f3e"/>
    <stop offset=".72" stop-color="#4a3626"/>
    <stop offset=".88" stop-color="#2a1d15"/>
    <stop offset="1" stop-color="#17100b"/>
  </linearGradient>
  <!-- concave underside: always in occlusion, the dark that gives the hook its read -->
  <linearGradient id="st-under" x1="0.1" y1="0.1" x2="0.85" y2="0.9">
    <stop offset="0" stop-color="#2b2016"/>
    <stop offset=".45" stop-color="#1a130d"/>
    <stop offset="1" stop-color="#100b08"/>
  </linearGradient>
  <linearGradient id="st-sinew" x1="0.2" y1="1" x2="0.8" y2="0">
    <stop offset="0" stop-color="#6d4f3c"/>
    <stop offset=".45" stop-color="#a9806a"/>
    <stop offset="1" stop-color="#d8b9a6"/>
  </linearGradient>
  <linearGradient id="st-cut" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#8a6b50"/>
    <stop offset=".4" stop-color="#5a4330"/>
    <stop offset=".78" stop-color="#32241a"/>
    <stop offset="1" stop-color="#4a3a2c"/>
  </linearGradient>
  <linearGradient id="st-spec" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#fffdf6"/>
    <stop offset=".35" stop-color="#fdf3dd"/>
    <stop offset=".72" stop-color="#cbb99a"/>
    <stop offset="1" stop-color="#6d5c47"/>
  </linearGradient>
</defs>

<g transform="rotate(6 128 128)">
  <!-- 1. tendon stub, behind the base: three cords torn out of the joint -->
  <path fill="url(#st-sinew)" d="M62 44 C52 32 49 22 57 15 C60 25 67 31 76 36 Z"/>
  <path fill="url(#st-sinew)" d="M78 36 C75 22 77 14 86 11 C84 21 88 29 94 38 Z"/>
  <path fill="#5c4133" d="M62 44 C57 36 53 27 53 19 C57 28 63 34 70 39 Z"/>
  <path fill="#443026" d="M80 36 C78 26 79 19 84 14 C83 23 85 30 88 36 Z"/>

  <!-- 2. silhouette + contour -->
  <path fill="url(#st-cont)" d="M56 40 L112 58 C186 78 214 152 176 216 L150 238 C150 190 124 146 88 110 C70 88 60 62 56 40 Z"/>

  <!-- 3. keratin body, inset from the contour -->
  <path fill="url(#st-horn)" d="M63 48 L110 64 C178 84 204 152 170 210 L155 228 C154 186 122 146 92 112 C76 92 67 68 63 48 Z"/>

  <!-- 4. concave underside plane. The hook only reads as a hook if this stays dark. -->
  <path fill="url(#st-under)" d="M78 60 C84 84 96 102 112 120 C140 150 158 184 160 216 L155 228 C154 186 122 146 92 112 C83 100 79 78 78 60 Z"/>
  <path fill="#0d0906" d="M96 104 C122 132 146 166 155 202 L158 220 C150 186 128 150 100 118 Z"/>

  <!-- 5. growth ridges across the horn. Each is >=7 units and sits within a narrow
          value band of the plane under it, so going sub-pixel at 32px costs detail
          and not contrast. -->
  <path fill="#5d4830" d="M104 70 C130 84 150 104 162 128 L156 132 C144 110 126 92 102 78 Z"/>
  <path fill="#c0a87f" d="M104 64 C132 79 153 100 166 126 L162 128 C149 104 128 84 102 70 Z"/>
  <path fill="#40301f" d="M128 104 C150 122 166 146 172 172 L166 173 C159 149 144 128 124 110 Z"/>
  <path fill="#8d7450" d="M126 100 C150 119 167 144 174 170 L172 172 C165 147 148 123 124 106 Z"/>
  <path fill="#2c2015" d="M152 150 C164 168 170 190 170 208 L164 208 C163 190 157 170 147 154 Z"/>

  <!-- 6. chipped tip + the crack running back from it. Tapered polygons, minimum
          6 units wide; nothing here is a stroke that can starve to a half pixel. -->
  <path fill="#0a0705" d="M150 238 L166 212 L170 222 L159 232 Z"/>
  <path fill="#120c08" d="M158 196 L166 200 L160 214 L153 210 Z"/>
  <path fill="#6b5640" d="M157 194 L165 199 L163 203 L155 199 Z"/>
  <path fill="#070504" d="M163 176 L168 178 L162 196 L156 193 L160 184 Z"/>

  <!-- 7. the long keratin specular on the convex edge - the single most important
          mark on this piece -->
  <path fill="url(#st-spec)" d="M84 54 C152 76 196 134 186 194 L176 192 C184 140 146 86 80 64 Z"/>
  <path fill="#ffffff" d="M86 56 C116 66 142 84 160 106 L155 110 C138 90 114 73 83 63 Z"/>

  <!-- 8. cool reflected fill on the concave edge: what keeps the dark underside from
          welding itself to the neon background -->
  <path fill="#3f6f86" d="M150 236 C152 196 134 158 108 126 L104 132 C128 162 146 198 145 234 Z"/>
  <path fill="#7fc4dc" d="M149 224 C149 200 140 176 126 154 L123 158 C135 179 144 202 145 224 Z"/>

  <!-- 9. the severed base: a cut face, not a tapered end -->
  <path fill="url(#st-cut)" d="M56 40 L112 58 L104 70 L60 54 Z"/>
  <path fill="#1a120c" d="M60 54 L104 70 L102 75 L59 59 Z"/>
  <path fill="#c3a888" d="M57 41 L111 59 L109 63 L56 46 Z"/>
  <!-- marrow/quick cavity in the cut -->
  <path fill="#2a1a14" d="M74 50 C82 50 90 54 94 60 C88 62 79 60 73 56 Z"/>
  <path fill="#8d5f4f" d="M76 52 C83 52 89 55 92 59 C87 60 80 58 76 55 Z"/>
</g>
</svg>
